<script>

/* =====================================================
   PENGATURAN KECEPATAN (ubah angka di sini)
===================================================== */

const SPEED_BOOST = 8;          // pengali kecepatan seluruh game (sebelumnya 1)
const NITRO_MULT = 10;           // kekuatan nitro (sebelumnya 1.8)
const UPGRADE_SPEED_BONUS = 10;    // tambahan per level upgrade speed (sebelumnya 1.5)
const MAP_DIFFICULTY_BONUS = 3.15; // map lebih sulit = lebih cepat
const DIST_SCALE = 5.5;           // jarak balapan dikali ini agar durasi tetap seimbang
const FINISH_DISTANCE = 15000 * DIST_SCALE;
const LAP_DISTANCE = FINISH_DISTANCE / 3;
const LANES = [-5, -2.5, 0, 2.5, 5];


/* =====================================================
   VARIABEL GAME
===================================================== */

let gameRunning = false;
let gamePaused = false;

let score = 0;
let nitro = 100;
let playerX = 0;

let leftPressed = false;
let rightPressed = false;
let nitroPressed = false;

let lastEnemySpawn = 0;
let trainTimer = 8;
let gameLoopStarted = false;


/* =====================================================
   HELPER
===================================================== */

function functionExists(name) {
  return typeof window[name] === "function";
}

function clampVal(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function lerpVal(a, b, t) {
  return a + (b - a) * t;
}

function randomLane() {
  return LANES[Math.floor(Math.random() * LANES.length)];
}

function clearObjects(list) {
  if (!Array.isArray(list)) return;
  list.forEach(o => {
    if (o && scene) scene.remove(o);
  });
}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

  gameRunning = false;
  gamePaused = false;

  showScreen("game");

  /* INIT THREE.JS */

  try {

    if (!scene || !camera || !renderer) {

      if (functionExists("init3D")) {
        init3D();
      } else {
        console.error("ERROR: fungsi init3D() tidak ditemukan.");
        return;
      }

    }

  } catch (error) {
    console.error("Gagal menjalankan init3D():", error);
    return;
  }

  requestAnimationFrame(() => {
    try {
      if (functionExists("resizeGame")) resizeGame();
    } catch (error) {
      console.warn("resizeGame() error:", error);
    }
  });

  /* RESET STATE */

  gameRunning = true;
  gamePaused = false;

  score = 0;
  nitro = 100;
  playerX = 0;

  leftPressed = false;
  rightPressed = false;
  nitroPressed = false;

  lastEnemySpawn = 0;
  trainTimer = 8;

  const pauseScreen = document.getElementById("pauseScreen");
  if (pauseScreen) pauseScreen.classList.remove("active");

  /* HAPUS OBJEK LAMA */

  clearObjects(enemies);
  enemies = [];

  clearObjects(particles);
  particles = [];

  /* VISUAL MAP */

  try {
    if (functionExists("applyMapVisuals")) applyMapVisuals();
  } catch (error) {
    console.warn("applyMapVisuals() gagal:", error);
  }

  /* DUNIA */

  try {

    if (functionExists("createRoad")) createRoad();
    if (functionExists("createScenery")) createScenery();
    if (functionExists("createTrain")) createTrain();

  } catch (error) {
    console.error("Gagal membuat dunia game:", error);
    gameRunning = false;
    return;
  }

  /* PLAYER */

  if (playerCar && scene) {
    scene.remove(playerCar);
    playerCar = null;
  }

  try {

    const car = cars[save.selectedCar];

    if (!car || !functionExists("createCar")) {
      console.error("Mobil atau createCar() tidak ditemukan.");
      gameRunning = false;
      return;
    }

    playerCar = createCar(car.color);

    if (!playerCar) {
      gameRunning = false;
      return;
    }

    playerCar.position.set(0, 0, 0);
    scene.add(playerCar);

  } catch (error) {
    console.error("Gagal membuat mobil player:", error);
    gameRunning = false;
    return;
  }

  /* CAMERA */

  if (camera) {
    camera.position.set(0, 5, 10);
    camera.lookAt(0, 0.5, -18);
  }

  if (clock) clock.start();

  updateHUD(0, 0);

  if (!gameLoopStarted) {
    gameLoopStarted = true;
    requestAnimationFrame(gameLoop);
  }

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {

  if (!gameRunning) {
    gameLoopStarted = false;
    return;
  }

  requestAnimationFrame(gameLoop);

  if (gamePaused) return;

  let dt = 0.016;

  try {
    if (clock) dt = Math.min(clock.getDelta(), 0.05);
  } catch (error) {
    console.warn("Clock error:", error);
  }

  try {
    updateGame(dt);
  } catch (error) {
    console.error("ERROR DI updateGame():", error);
    gameRunning = false;
    return;
  }

  try {
    if (renderer && scene && camera) renderer.render(scene, camera);
  } catch (error) {
    console.error("ERROR RENDER THREE.JS:", error);
    gameRunning = false;
  }

}


/* =====================================================
   PROGRESS KECEPATAN & TRAFFIC
===================================================== */

function getStage(limits, values) {

  for (let i = 0; i < limits.length; i++) {
    if (score < limits[i] * DIST_SCALE) return values[i];
  }

  return values[values.length - 1];

}

function getSpeedProgress() {
  return getStage([2500, 5000, 8000, 11000], [0, 0.20, 0.40, 0.70, 1]);
}

function getTrafficProgress() {
  return getStage([2000, 4500, 7000, 10000], [0, 0.20, 0.40, 0.70, 1]);
}


/* =====================================================
   SPAWN MUSUH
===================================================== */

function spawnEnemy() {

  if (!functionExists("createEnemy")) return;

  createEnemy();

  const enemy = enemies[enemies.length - 1];

  if (enemy) {
    enemy.userData.laneOffset = randomLane();
    enemy.position.x = enemy.userData.laneOffset;
  }

}


/* =====================================================
   UPDATE GAME
===================================================== */

function updateGame(dt) {

  if (!playerCar) return;

  const car = cars[save.selectedCar];
  const map = maps[save.selectedMap];

  if (!car || !map) {
    console.error("Data mobil atau map tidak ditemukan.");
    return;
  }

  const speedProgress = getSpeedProgress();
  const trafficProgress = getTrafficProgress();

  /* ---------- SPEED ---------- */

  let speed = map.baseSpeed;

  speed += car.speed * 3.4;
  speed += save.upgrades.speed * UPGRADE_SPEED_BONUS;

  speed *= 1 + speedProgress * 3.85;

  speed *= SPEED_BOOST * (1 + (map.difficulty - 1) * MAP_DIFFICULTY_BONUS);

  /* ---------- NITRO ---------- */

  if (nitroPressed && nitro > 0) {

    speed *= NITRO_MULT;
    nitro -= 35 * dt;

    if (functionExists("updateNitroEffect")) updateNitroEffect(true);

  } else {

    nitro += 8 * dt;

    if (functionExists("updateNitroEffect")) updateNitroEffect(false);

  }

  nitro = clampVal(nitro, 0, 100);

  /* ---------- SCORE ---------- */

  score += speed * dt * 6;

  /* ---------- STEERING ---------- */

  const handling = 7 + car.handling + save.upgrades.handling;

  if (leftPressed) playerX -= handling * dt;
  if (rightPressed) playerX += handling * dt;

  playerX = clampVal(playerX, -6.2, 6.2);

  playerCar.position.x = lerpVal(playerCar.position.x, playerX, 0.18);

  let lean = 0;
  if (leftPressed) lean = 0.08;
  if (rightPressed) lean = -0.08;

  playerCar.rotation.z = lerpVal(playerCar.rotation.z, lean, 0.12);

  /* ---------- ROAD ---------- */

  roadSegments.forEach(segment => {

    if (!segment) return;

    segment.position.z += speed * dt;

    if (segment.position.z > 40) segment.position.z -= 480;

    segment.position.x = 0;

  });

  /* ---------- SCENERY ---------- */

  scenery.forEach(object => {

    if (!object) return;

    object.position.z += speed * dt;

    if (object.position.z > 40) {
      object.position.z -= 430;
      repositionScenery(object);
    }

  });

  /* ---------- TRAFFIC + COLLISION ---------- */

  for (const enemy of enemies) {

    if (!enemy) continue;

    const prevZ = enemy.position.z;

    enemy.position.z += speed * dt * 0.75;

    const lane =
      typeof enemy.userData?.laneOffset === "number"
        ? enemy.userData.laneOffset
        : 0;

    enemy.position.x = lerpVal(enemy.position.x, lane, 0.08);

    if (enemy.position.z > 30) {
      resetEnemy(enemy);
      continue;
    }

    const z = enemy.position.z;
    const dx = Math.abs(enemy.position.x - playerCar.position.x);

    /*
      Deteksi tabrakan diperkuat: musuh yang "melompati" mobil
      pada kecepatan tinggi tetap dianggap menabrak.
    */

    const hitZ = Math.abs(z) < 3.2 || (prevZ < -3.2 && z > 3.2);

    if (dx < 2.1 && hitZ) {
      crash(enemy);
      break;
    }

  }

  if (!gameRunning) return;

  /* ---------- SPAWN TRAFFIC ---------- */

  lastEnemySpawn += dt;

  const maxTraffic = Math.floor(2 + map.maxTraffic * trafficProgress);

  const spawnInterval = map.spawnTime * (1 - trafficProgress * 0.35);

  if (lastEnemySpawn > spawnInterval && enemies.length < maxTraffic) {
    spawnEnemy();
    lastEnemySpawn = 0;
  }

  if (enemies.length < maxTraffic && enemies.length < map.maxTraffic) {
    spawnEnemy();
  }

  /* ---------- TRAIN ---------- */

  trainTimer -= dt;

  if (trainTimer <= 0) {

    if (functionExists("startTrain")) startTrain();

    trainTimer = 12 + Math.random() * 8;

  }

  if (functionExists("updateTrain")) updateTrain(dt);

  if (!gameRunning) return;

  /* ---------- CAMERA ---------- */

  if (camera) {

    camera.position.x = lerpVal(
      camera.position.x,
      playerCar.position.x * 0.45,
      0.05
    );

    camera.lookAt(playerCar.position.x * 0.2, 0.5, -18);

  }

  /* ---------- HUD & FINISH ---------- */

  updateHUD(speed, score);

  if (score >= FINISH_DISTANCE) finishRace();

}


/* =====================================================
   UPDATE HUD
===================================================== */

function updateHUD(speed, distance) {

  const speedText = document.getElementById("speedText");
  if (speedText) speedText.textContent = Math.floor(speed * 8);

  const scoreText = document.getElementById("scoreText");
  if (scoreText) scoreText.textContent = Math.floor(distance);

  const nitroFill = document.getElementById("nitroFill");
  if (nitroFill) nitroFill.style.width = nitro + "%";

  const lap = Math.min(3, Math.floor(score / LAP_DISTANCE) + 1);

  const lapText = document.getElementById("lapText");
  if (lapText) lapText.textContent = lap + " / 3";

}


/* =====================================================
   SCENERY & ENEMY RESET
===================================================== */

function repositionScenery(object) {

  if (!object || !maps || !maps[save.selectedMap]) return;

  const env = maps[save.selectedMap].environment;

  const side = Math.random() > 0.5 ? 1 : -1;

  if (env === "city") {
    object.position.x = side * (9 + Math.random() * 22);
  }

  if (env === "desert") {
    object.position.x = side * (10 + Math.random() * 25);
  }

  if (env === "night") {
    object.position.x = side * (9 + Math.random() * 25);
  }

}

function resetEnemy(enemy) {

  if (!enemy) return;

  enemy.position.z = -180 - Math.random() * 100;

  if (!enemy.userData) enemy.userData = {};

  enemy.userData.laneOffset = randomLane();
  enemy.position.x = enemy.userData.laneOffset;

}


/* =====================================================
   CRASH
===================================================== */

function crash(enemy) {

  if (!gameRunning) return;

  gameRunning = false;
  gamePaused = false;

  leftPressed = false;
  rightPressed = false;
  nitroPressed = false;

  if (enemy) enemy.position.z = 999;

  if (navigator.vibrate) navigator.vibrate([150, 80, 250]);

  const resultTitle = document.getElementById("resultTitle");
  if (resultTitle) resultTitle.textContent = "💥 GAME OVER";

  const resultScore = document.getElementById("resultScore");
  if (resultScore) resultScore.textContent = "Jarak: " + Math.floor(score);

  const rewardMoney = document.getElementById("rewardMoney");
  if (rewardMoney) rewardMoney.textContent = "0";

  setTimeout(() => showScreen("result"), 500);

}


/* =====================================================
   FINISH
===================================================== */

function finishRace() {

  if (!gameRunning) return;

  gameRunning = false;

  leftPressed = false;
  rightPressed = false;
  nitroPressed = false;

  const reward = 1500 + Math.floor(score / 20);

  save.money += reward;

  if (functionExists("saveGame")) saveGame();

  const rewardMoney = document.getElementById("rewardMoney");
  if (rewardMoney) rewardMoney.textContent = reward;

  const resultScore = document.getElementById("resultScore");
  if (resultScore) resultScore.textContent = "Jarak: " + Math.floor(score);

  const resultTitle = document.getElementById("resultTitle");
  if (resultTitle) resultTitle.textContent = "🏆 MENANG!";

  showScreen("result");

}


/* =====================================================
   PAUSE & HOME
===================================================== */

function togglePause() {

  if (!gameRunning) return;

  gamePaused = !gamePaused;

  const pause = document.getElementById("pauseScreen");

  if (!pause) return;

  if (gamePaused) {

    pause.classList.add("active");

  } else {

    pause.classList.remove("active");

    if (clock) clock.start();

  }

}

function backToHome() {

  gameRunning = false;
  gamePaused = false;

  leftPressed = false;
  rightPressed = false;
  nitroPressed = false;

  const pauseScreen = document.getElementById("pauseScreen");
  if (pauseScreen) pauseScreen.classList.remove("active");

  showScreen("menu");

}


console.log("GameLogic berhasil dimuat.");

</script>
