<!-- =====================================================
     GAME 3D ENGINE  (VERSI RINGAN)
     -----------------------------------------------------
     Perubahan utama dibanding versi lama:
     1. Tiap mobil / bus / truk / gedung / kereta digabung
        jadi 1 objek (sebelumnya 20-30 objek per benda).
        Draw call turun dari ~800 menjadi ~120.
     2. Jalan: aspal & garis tepi dibuat 1 kali (diam),
        hanya garis putus-putus yang bergerak.
     3. Kualitas otomatis: pixel ratio dibatasi, dan kalau
        browser memakai rendering software (tanpa GPU),
        game masuk MODE RENDAH (resolusi turun, tanpa bayangan).
     4. Material PBR (Standard) diganti Lambert yang lebih ringan.
     5. Bentuk 3D di-cache, jadi tidak ada jeda saat musuh muncul.

     Semua nama fungsi yang dipakai file lain tetap sama.
===================================================== -->

/* =====================================================
   KUALITAS OTOMATIS
   Dicek sekali saat game dimuat.
===================================================== */

function g3IsSoftwareRenderer(){

  try{

    const c =
      document.createElement("canvas");

    const gl =
      c.getContext("webgl") ||
      c.getContext("experimental-webgl");

    /* Tidak ada WebGL sama sekali */

    if(!gl)
      return true;

    const ext =
      gl.getExtension(
        "WEBGL_debug_renderer_info"
      );

    const name =
      ext
      ? String(
          gl.getParameter(
            ext.UNMASKED_RENDERER_WEBGL
          )
        )
      : "";

    const lose =
      gl.getExtension(
        "WEBGL_lose_context"
      );

    if(lose)
      lose.loseContext();

    /* Rendering lewat CPU = sangat lambat */

    return /swiftshader|llvmpipe|software|basic render/i
      .test(name);

  }

  catch(e){

    return false;

  }

}


/* -----------------------------------------------------
   PENGATURAN KUALITAS (boleh kamu ubah)
   Ratio 1 = resolusi penuh (tajam). Makin kecil = makin buram
   tapi makin ringan.
   Game mulai dari resolusi TERTAJAM, lalu turun otomatis
   hanya kalau FPS-nya di bawah target.
----------------------------------------------------- */

const G3_SETTINGS = {

  /* MODE RENDAH (browser tanpa GPU asli, misalnya laptop kamu sekarang) */

  lowStartRatio: 0.85,   // resolusi awal
  lowMinRatio: 0.5,      // resolusi paling buram yang diizinkan
  lowTargetFps: 22,      // naikkan = lebih mulus tapi lebih buram

  /* MODE NORMAL (ada GPU asli) */

  normalMaxRatio: 1.5,   // batas resolusi awal (HP biasanya 2.5-3)
  normalMinRatio: 0.75,
  normalTargetFps: 36

};


const g3Q = (function(){

  const low =
    g3IsSoftwareRenderer();

  const dpr =
    window.devicePixelRatio || 1;

  const S =
    G3_SETTINGS;

  return {

    /* true = tanpa GPU asli, pakai mode rendah */

    low: low,

    /* Resolusi render saat ini (turun otomatis kalau lag) */

    pixelRatio:
      low
      ? S.lowStartRatio
      : Math.min(dpr, S.normalMaxRatio),

    minRatio:
      low
      ? S.lowMinRatio
      : S.normalMinRatio,

    targetFps:
      low
      ? S.lowTargetFps
      : S.normalTargetFps,

    /* Antialias aktif kalau ada GPU asli (murah di GPU HP & laptop) */

    antialias:
      !low,

    /* Bayangan dimatikan di mode rendah */

    shadows:
      !low

  };

})();

/* Dibaca oleh fps.js untuk ditampilkan */

window.GAME_QUALITY = g3Q;


/* -----------------------------------------------------
   RESOLUSI OTOMATIS
   Setiap 2 detik dihitung FPS-nya. Kalau 2 kali berturut-turut
   di bawah target, resolusi diturunkan 15%. Resolusi tidak
   pernah dinaikkan lagi, supaya tidak bolak-balik berubah.
----------------------------------------------------- */

let g3AdaptFrames = 0;
let g3AdaptStart = 0;
let g3AdaptLast = 0;
let g3AdaptBad = 0;


function g3Adapt(){

  const now =
    performance.now();


  /* Ada jeda (pause / ganti layar) -> hitung ulang dari awal */

  if(now - g3AdaptLast > 250){

    g3AdaptStart = now;
    g3AdaptFrames = 0;

  }

  g3AdaptLast = now;
  g3AdaptFrames++;


  const elapsed =
    now - g3AdaptStart;

  if(elapsed < 2000)
    return;


  const fps =
    g3AdaptFrames * 1000 / elapsed;

  g3AdaptStart = now;
  g3AdaptFrames = 0;


  if(fps < g3Q.targetFps)
    g3AdaptBad++;
  else
    g3AdaptBad = 0;


  if(
    g3AdaptBad >= 2 &&
    g3Q.pixelRatio > g3Q.minRatio
  ){

    g3Q.pixelRatio =
      Math.max(
        g3Q.minRatio,
        g3Q.pixelRatio * 0.85
      );

    g3AdaptBad = 0;

    renderer.setPixelRatio(
      g3Q.pixelRatio
    );

    resizeGame();

  }

}


/* =====================================================
   ALAT: GABUNGKAN BANYAK BALOK JADI 1 OBJEK
   -----------------------------------------------------
   Setiap bagian (balok / silinder) punya warna sendiri
   (vertex color), lalu semuanya digabung menjadi satu
   geometri. Hasilnya: 1 draw call, bukan puluhan.
===================================================== */

let g3BoxGeo = null;
let g3CylGeo = null;
let g3VColorMat = null;


function g3UnitBox(){

  if(!g3BoxGeo)
    g3BoxGeo =
      new THREE.BoxGeometry(1, 1, 1);

  return g3BoxGeo;

}


function g3UnitCyl(){

  if(!g3CylGeo)
    g3CylGeo =
      new THREE.CylinderGeometry(
        1, 1, 1, 16
      );

  return g3CylGeo;

}


function g3VertexMaterial(){

  if(!g3VColorMat)
    g3VColorMat =
      new THREE.MeshLambertMaterial({
        vertexColors: true
      });

  return g3VColorMat;

}


/* Balok ukuran w x h x d di posisi x,y,z (rx = putar sumbu X) */

function pBox(color, w, h, d, x, y, z, rx){

  return {
    geo: g3UnitBox(),
    color: color,
    sx: w, sy: h, sz: d,
    x: x, y: y, z: z,
    rx: rx || 0
  };

}


/* Roda: silinder rebah, sumbunya searah X */

function pWheel(color, r, thick, x, y, z){

  return {
    geo: g3UnitCyl(),
    color: color,
    sx: r, sy: thick, sz: r,
    x: x, y: y, z: z,
    rz: Math.PI / 2
  };

}


/* Pipa: silinder yang sumbunya searah Z */

function pPipe(color, r, len, x, y, z){

  return {
    geo: g3UnitCyl(),
    color: color,
    sx: r, sy: len, sz: r,
    x: x, y: y, z: z,
    rx: Math.PI / 2
  };

}


/* Geometri bebas (dipakai kaktus), rz = putar sumbu Z */

function pGeo(geo, color, x, y, z, rz){

  return {
    geo: geo,
    color: color,
    sx: 1, sy: 1, sz: 1,
    x: x, y: y, z: z,
    rz: rz || 0
  };

}


const g3Mat4 = new THREE.Matrix4();
const g3Mat3 = new THREE.Matrix3();
const g3Quat = new THREE.Quaternion();
const g3Euler = new THREE.Euler();
const g3Pos = new THREE.Vector3();
const g3Scale = new THREE.Vector3();
const g3Vec = new THREE.Vector3();
const g3Col = new THREE.Color();


function mergeParts(parts){

  const position = [];
  const normal = [];
  const color = [];
  const index = [];

  let offset = 0;

  parts.forEach(
    p => {

      g3Euler.set(
        p.rx || 0,
        p.ry || 0,
        p.rz || 0
      );

      g3Quat.setFromEuler(g3Euler);

      g3Pos.set(
        p.x || 0,
        p.y || 0,
        p.z || 0
      );

      g3Scale.set(
        p.sx,
        p.sy,
        p.sz
      );

      g3Mat4.compose(
        g3Pos,
        g3Quat,
        g3Scale
      );

      g3Mat3.getNormalMatrix(g3Mat4);

      g3Col.setHex(p.color);


      const pa =
        p.geo.attributes.position;

      const na =
        p.geo.attributes.normal;


      for(
        let i = 0;
        i < pa.count;
        i++
      ){

        g3Vec
          .fromBufferAttribute(pa, i)
          .applyMatrix4(g3Mat4);

        position.push(
          g3Vec.x,
          g3Vec.y,
          g3Vec.z
        );


        g3Vec
          .fromBufferAttribute(na, i)
          .applyMatrix3(g3Mat3)
          .normalize();

        normal.push(
          g3Vec.x,
          g3Vec.y,
          g3Vec.z
        );


        color.push(
          g3Col.r,
          g3Col.g,
          g3Col.b
        );

      }


      if(p.geo.index){

        for(
          let i = 0;
          i < p.geo.index.count;
          i++
        ){

          index.push(
            p.geo.index.getX(i) + offset
          );

        }

      }

      else{

        for(
          let i = 0;
          i < pa.count;
          i++
        ){

          index.push(i + offset);

        }

      }


      offset += pa.count;

    }
  );


  const geometry =
    new THREE.BufferGeometry();

  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(position, 3)
  );

  geometry.setAttribute(
    "normal",
    new THREE.Float32BufferAttribute(normal, 3)
  );

  geometry.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(color, 3)
  );

  geometry.setIndex(index);

  return geometry;

}


/* =====================================================
   INIT 3D
===================================================== */

function init3D(){

  if(threeInitialized){

    resizeGame();

    return;

  }

  threeInitialized = true;

  const container =
    document.getElementById("threeContainer");


  scene =
    new THREE.Scene();


  /* LANGIT */

  scene.background =
    new THREE.Color(0x80cbed);


  scene.fog =
    new THREE.Fog(
      0x80cbed,
      70,
      360
    );


  /* CAMERA
     far = 380 (kabut sudah menutup semuanya di 360),
     jadi objek di luar itu tidak perlu digambar. */

  camera =
    new THREE.PerspectiveCamera(
      65,
      container.clientWidth /
      container.clientHeight,
      0.5,
      380
    );


  camera.position.set(
    0,
    5,
    10
  );


  /* RENDERER */

  renderer =
    new THREE.WebGLRenderer({

      antialias: g3Q.antialias,

      /* Minta browser memakai GPU yang kuat (laptop 2 GPU) */

      powerPreference:
        "high-performance"

    });


  renderer.setPixelRatio(
    g3Q.pixelRatio
  );


  renderer.setSize(
    container.clientWidth,
    container.clientHeight,
    false
  );


  /* Ukuran tampilan canvas diatur CSS (ikut container) */

  renderer.domElement.style.cssText =
    "display:block;width:100%;height:100%;";


  /* Pantau FPS di setiap render, resolusi turun otomatis kalau lag */

  const g3OriginalRender =
    renderer.render.bind(renderer);

  renderer.render = function(s, c){

    g3Adapt();

    g3OriginalRender(s, c);

  };


  renderer.shadowMap.enabled =
    g3Q.shadows;

  renderer.shadowMap.type =
    THREE.PCFShadowMap;


  container.innerHTML = "";

  container.appendChild(
    renderer.domElement
  );


  /* LIGHT */

  const hemi =
    new THREE.HemisphereLight(
      0xffffff,
      0x405060,
      1.5
    );

  scene.add(hemi);


  const sun =
    new THREE.DirectionalLight(
      0xffffff,
      2
    );

  sun.position.set(
    -20,
    40,
    20
  );

  sun.castShadow =
    g3Q.shadows;


  /* Area bayangan: hanya di sekitar mobil pemain */

  sun.shadow.camera.left = -8;
  sun.shadow.camera.right = 8;
  sun.shadow.camera.top = 8;
  sun.shadow.camera.bottom = -8;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 120;
  sun.shadow.camera.updateProjectionMatrix();

  scene.add(sun);


  clock =
    new THREE.Clock();


  window.addEventListener(
    "resize",
    resizeGame
  );

}


/* =====================================================
   RESIZE
===================================================== */

function resizeGame(){

  if(
    !renderer ||
    !camera
  )
    return;


  const container =
    document.getElementById(
      "threeContainer"
    );


  if(!container)
    return;


  const width =
    container.clientWidth;

  const height =
    container.clientHeight;


  if(
    width <= 0 ||
    height <= 0
  )
    return;


  camera.aspect =
    width / height;

  camera.updateProjectionMatrix();


  renderer.setSize(
    width,
    height,
    false
  );

}

/* =====================================================

/* =====================================================
   CREATE CAR
   DEPAN MOBIL = -Z
   -----------------------------------------------------
   Seluruh badan mobil = 1 objek (hasil gabungan).
   Bentuknya di-cache per warna.
===================================================== */

const g3CarGeoCache = {};


function g3CarGeometry(color){

  if(g3CarGeoCache[color])
    return g3CarGeoCache[color];


  const parts = [

    /* BODY, KAP DEPAN, BAGASI */

    pBox(color, 2.5, .62, 4.3, 0, .65, 0),
    pBox(color, 2.25, .30, 1.25, 0, .98, -1.42),
    pBox(color, 2.25, .28, .85, 0, .94, 1.45),

    /* KABIN */

    pBox(0x111827, 1.85, .72, 1.75, 0, 1.28, -.10),

    /* KACA DEPAN & BELAKANG */

    pBox(0x172b45, 1.55, .42, .08, 0, 1.36, -.99, -.10),
    pBox(0x172b45, 1.55, .40, .08, 0, 1.36, .79, .10),

    /* LAMPU DEPAN */

    pBox(0xffffff, .45, .18, .12, -.78, .76, -2.17),
    pBox(0xffffff, .45, .18, .12, .78, .76, -2.17),

    /* LAMPU BELAKANG */

    pBox(0xef1111, .42, .16, .12, -.78, .75, 2.17),
    pBox(0xef1111, .42, .16, .12, .78, .75, 2.17),

    /* BUMPER */

    pBox(0x111111, 2.35, .18, .16, 0, .43, -2.18),
    pBox(0x111111, 2.35, .18, .16, 0, .43, 2.18),

    /* KNALPOT */

    pPipe(0x555555, .10, .35, -.65, .45, 2.30),
    pPipe(0x555555, .10, .35, .65, .45, 2.30)

  ];


  /* RODA */

  [
    [-1.20, .45, -1.35],
    [ 1.20, .45, -1.35],
    [-1.20, .45,  1.35],
    [ 1.20, .45,  1.35]

  ].forEach(
    pos => {

      parts.push(
        pWheel(
          0x090909,
          .42,
          .34,
          pos[0],
          pos[1],
          pos[2]
        )
      );

    }
  );


  g3CarGeoCache[color] =
    mergeParts(parts);

  return g3CarGeoCache[color];

}


/* Mobil tanpa api nitro (untuk musuh) */

function createCarBody(color){

  const car =
    new THREE.Mesh(
      g3CarGeometry(color),
      g3VertexMaterial()
    );

  car.castShadow =

  return car;

}


/* Mobil pemain (dengan api nitro) */

function createCar(color){

  const car =
    createCarBody(color);


  const flameLeft =
    createNitroFlame();

  flameLeft.position.set(
    -.65,
    .45,
    2.40
  );

  car.add(flameLeft);


  const flameRight =
    createNitroFlame();

  flameRight.position.set(
    .65,

  );

  car.add(flameRight);


  car.userData.nitroFlames = [

}


/* =====================================================
   UPDATE NOS
===================================================== */

function updateNitroEffect(active){

  if(!playerCar)
    return;


  const flames =
    playerCar.userData.nitroFlames;


  if(!flames)
    return;


  flames.forEach(
    flame => {

      flame.visible =
        active;

      if(active){

        const scale =
          .75 +
          Math.random() * .45;

        flame.scale.set(
          scale,
          scale,
          scale
        );

      }

    }
  );

}


/* =====================================================
   CREATE ENEMY
===================================================== */

function createEnemy(){

  const types = [
    "car",
    "bus",
    "truck"
  ];


  const type =
    types[
      Math.floor(
        Math.random() *
        types.length
      )
    ];


  let object;


  if(type === "car"){

    const colors = [
      0xfacc15,
      0x22c55e,
      0xa855f7,
      0xef4444,
      0xffffff
    ];


    object =
      createCarBody(
        colors[
          Math.floor(
            Math.random() *
            colors.length
          )
        ]
      );

  }


  if(type === "bus"){

    object =
      createBus();

  }


  if(type === "truck"){

    object =
      createTruck();

  }


  object.userData.type =
    type;


  object.userData.laneOffset =
    0;


  object.position.z =
    -180 -
    Math.random() * 100;


  const lanes = [
    -5,
    -2.5,

/* =====================================================
   TRAIN
   Seluruh kereta = 1 objek.
===================================================== */

let g3TrainGeo = null;


function g3BuildTrainGeometry(){

  const parts = [

    /* LOKOMOTIF (digeser z = -4) */

    pBox(0x991b1b, 3.5, 2.3, 6, 0, 1.35, -4),
    pBox(0x7f1d1d, 3.2, 1.8, .35, 0, 1.35, -7.1),

    /* LAMPU KERETA */

    pBox(0xffffaa, .5, .5, .5, 0, 1.6, -7.35),

    /* CEROBONG */

    pGeo(
      new THREE.CylinderGeometry(
        .32,
        .42,
        1.2,
        12
      ),
      0x202020,
      0,
      3.0,
      -5.5
    ),

    /* KABIN & JENDELA */

    pBox(0x111827, 3, 2.4, 2, 0, 2.25, -2.75),
    pBox(0x60a5fa, 2.2, .75, .08, 0, 2.45, -3.78)

  ];


  /* GERBONG */

  for(
    let i = 0;
    i < 3;
    i++
  ){

    const z =
      2 + i * 6;


    parts.push(
      pBox(
        i % 2 === 0
        ? 0x475569
        : 0x64748b,
        3.4,
        2.4,
        5.5,
        0,
        1.35,
        z
      )
    );


    /* JENDELA GERBONG (di sisi kiri & kanan) */

    [-1.5, 0, 1.5].forEach(
      dz => {

        parts.push(
          pBox(0x172554, .06, .55, 1.0, -1.72, 1.75, z + dz)
        );

        parts.push(
          pBox(0x172554, .06, .55, 1.0, 1.72, 1.75, z + dz)
        );

      }
    );

  }


  /* RODA KERETA */

  for(
    let z = -8;
    z <= 16;
    z += 4
  ){

    [-1.35, 1.35].forEach(
      x => {

        parts.push(
          pWheel(0x111111, .42, .25, x, .55, z)
        );

      }
    );

  }


  return mergeParts(parts);

}


function createTrain(){

  if(train){

    scene.remove(train);

  }


  if(!g3TrainGeo)
    g3TrainGeo =
      g3BuildTrainGeometry();


  train =
    new THREE.Mesh(
      g3TrainGeo,
      g3VertexMaterial()
    );


  train.position.set(
    -35,
    0,
    -70
  );


  train.userData.active =
    false;


  scene.add(train);

}


/* =====================================================
   TRAIN EVENT
===================================================== */

function startTrain(){

  if(!train)
    createTrain();


  train.userData.active =
    true;


  train.position.x =
    -35;


  train.position.z =
    -70;

}


/* =====================================================
   UPDATE TRAIN
===================================================== */

function updateTrain(dt){

  if(
    !train ||
    !train.userData.active
  )
    return;


  train.position.x +=
    30 * dt;


  if(
    train.position.x > 35
  ){

    train.userData.active =
      false;

  }


  if(!playerCar)
    return;


  const dz =
    Math.abs(
      train.position.z -
      playerCar.position.z
    );


  const dx =
    Math.abs(
      train.position.x -
      playerCar.position.x
    );


  if(
    dz < 5 &&
    dx < 4
  ){

    crash(train);

  }

}


/* =====================================================
   SCENERY
   -----------------------------------------------------
   Bentuk gedung dibuat sebagian saja (maks. 12 variasi per
   jenis), lalu dipakai ulang berkali-kali. Jadi tidak ada
   pembuatan bentuk baru tiap balapan dimulai.
===================================================== */

const g3Pool = {
  city: [],
  cactus: [],
  night: []
};


function g3PoolGeometry(type, size, make){

  const pool =
    g3Pool[type];


  if(pool.length < size){

    const geo =
      make();

    pool.push(geo);

    return geo;

  }


  return pool[
    Math.floor(
      Math.random() *
      pool.length
    )
  ];

}


function g3SceneryMesh(geo){

  return new THREE.Mesh(
    geo,
    g3VertexMaterial()
  );

}


function createScenery(){

  scenery.forEach(
    x => scene.remove(x)
  );

  scenery = [];


  const map =
    maps[save.selectedMap];


  for(
    let i = 0;
    i < 55;
    i++
  ){

    let object;


    /* CITY */

    if(map.id === 0){

      object =
        createCityBuilding();

    }


    /* DESERT */

    else if(map.id === 1){

      object =
        createCactus();

    }


    /* NIGHT */

    else{

      object =
        createNightBuilding();

    }


    object.position.z =
      -20 -
      Math.random() * 400;


    object.position.x =
      Math.random() > .5
      ?
      12 + Math.random() * 18
      :
      -12 - Math.random() * 18;


    scene.add(object);

    scenery.push(object);

  }

}


/* Gedung + jendela digabung jadi 1 bentuk.
   Jendela ditaruh di sisi yang MENGHADAP kamera (+Z). */

function g3MakeBuilding(baseColor, minHeight, extraHeight, windowColor){

  const height =
    minHeight +
    Math.random() * extraHeight;


  const parts = [

    pBox(
      baseColor,
      4,
      height,
      4,
      0,
      height / 2,
      0
    )

  ];


  for(
    let y = 2;
    y < height - 1;
    y += 2
  ){

    for(
      let x = -1;
      x <= 1;
      x++
    ){

      parts.push(
        pBox(
          windowColor(),
          .55,
          .55,
          .08,
          x,
          y,
          2.03
        )
      );

    }

  }


  return mergeParts(parts);

}
