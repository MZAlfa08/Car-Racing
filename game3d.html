/* =====================================================
   INIT 3D
===================================================== */

function init3D(){

  if(threeInitialized){

    resizeGame();

    return;

  }

  threeInitialized = true;

  const container =
    document.getElementById("threeContainer");


  scene =
    new THREE.Scene();


  /* LANGIT */

  scene.background =
    new THREE.Color(0x80cbed);


  scene.fog =
    new THREE.Fog(
      0x80cbed,
      70,
      360
    );


  /* CAMERA */

  camera =
    new THREE.PerspectiveCamera(
      65,
      container.clientWidth /
      container.clientHeight,
      0.1,
      600
    );


  camera.position.set(
    0,
    5,
    10
  );


  /* RENDERER */

  renderer =
    new THREE.WebGLRenderer({
      antialias:true
    });


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );


  renderer.setSize(
    container.clientWidth,
    container.clientHeight
  );


  renderer.shadowMap.enabled =
    true;

  renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


  container.innerHTML = "";

  container.appendChild(
    renderer.domElement
  );


  /* LIGHT */

  const hemi =
    new THREE.HemisphereLight(
      0xffffff,
      0x405060,
      1.5
    );

  scene.add(hemi);


  const sun =
    new THREE.DirectionalLight(
      0xffffff,
      2
    );

  sun.position.set(
    -20,
    40,
    20
  );

  sun.castShadow = true;

  scene.add(sun);


  clock =
    new THREE.Clock();


  window.addEventListener(
    "resize",
    resizeGame
  );

}


/* =====================================================
   RESIZE
===================================================== */

function resizeGame(){

  if(
    !renderer ||
    !camera
  )
    return;


  const container =
    document.getElementById(
      "threeContainer"
    );


  if(!container)
    return;


  const width =
    container.clientWidth;

  const height =
    container.clientHeight;


  if(
    width <= 0 ||
    height <= 0
  )
    return;


  camera.aspect =
    width / height;

  camera.updateProjectionMatrix();


  renderer.setSize(
    width,
    height,
    false
  );

}

/* =====================================================
   GROUND
===================================================== */

function createGround(map){

  const old =
    scene.getObjectByName(
      "gameGround"
    );


  if(old)
    scene.remove(old);


  const ground =
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        1000,
        1000
      ),

      new THREE.MeshStandardMaterial({

        color:
          map.ground,

        roughness:1

      })

    );


  ground.name =
    "gameGround";


  ground.rotation.x =
    -Math.PI / 2;


  ground.position.y =
    -.2;


  ground.position.z =
    -180;


  ground.receiveShadow =
    true;


  scene.add(ground);

}

/* =====================================================
   UPDATE NOS
===================================================== */

function updateNitroEffect(active){

  if(!playerCar)
    return;


  const flames =
    playerCar.userData.nitroFlames;


  if(!flames)
    return;


  flames.forEach(
    flame => {

      flame.visible =
        active;

      if(active){

        const scale =
          .75 +
          Math.random() * .45;

        flame.scale.set(
          scale,
          scale,
          scale
        );

      }

    }
  );

}


/* =====================================================
   CREATE ENEMY
===================================================== */

function createEnemy(){

  const types = [
    "car",
    "bus",
    "truck"
  ];


  const type =
    types[
      Math.floor(
        Math.random() *
        types.length
      )
    ];


  let object;


  if(type === "car"){

    const colors = [
      0xfacc15,
      0x22c55e,
      0xa855f7,
      0xef4444,
      0xffffff
    ];


    object =
      createCar(
        colors[
          Math.floor(
            Math.random() *
            colors.length
          )
        ]
      );

  }


  if(type === "bus"){

    object =
      createBus();

  }


  if(type === "truck"){

    object =
      createTruck();

  }


  object.userData.type =
    type;


  object.userData.laneOffset =
    0;


  object.position.z =
    -180 -
    Math.random() * 100;


  const lanes = [
    -5,
    -2.5,
    0,
    2.5,
    5
  ];


  object.position.x =
    lanes[
      Math.floor(
        Math.random() *
        lanes.length
      )
    ];


  scene.add(object);

  enemies.push(object);

}

    }
  );


  return group;

}


/* =====================================================

  /* =================================================

  ================================================= */

  const engine =

  /* BADAN */

  const engineBody =

      })

    );


  chimney.position.set(

  );


  engine.add(chimney);


  /* KABIN */

  const trainCabin =
    new THREE.Mesh(

      new THREE.BoxGeometry(

      ),

      new THREE.MeshStandardMaterial({

        color:0x111827,

      })

    );


  trainCabin.position.set(
    0,

  engine.add(trainCabin);


  /* JENDELA KABIN */

  const cabinWindow =
    new THREE.Mesh(

      new THREE.BoxGeometry(

        .75,
        .08
      ),

      new THREE.MeshStandardMaterial({

        color:0x60a5fa,

        metalness:.3,

        roughness:.2

      })

    );


  cabinWindow.position.set(
    0,
    2.45,
    .22
  );


  engine.add(cabinWindow);


  engine.position.z =
    -4;


  train.add(engine);


  /* =================================================
     GERBONG
  ================================================= */

  for(
    let i = 0;
    i < 3;
    i++
  ){

    const wagon =
      new THREE.Group();


    const wagonBody =
      new THREE.Mesh(

        new THREE.BoxGeometry(
          3.4,
          2.4,
          5.5
        ),

        new THREE.MeshStandardMaterial({

          color:
            i % 2 === 0
            ? 0x475569
            : 0x64748b,

          roughness:.7

        })

      );


    wagonBody.position.y =
      1.35;


    wagon.add(wagonBody);


    /* JENDELA GERBONG */

    for(
      let z = -1.5;
      z <= 1.5;
      z += 1.5
    ){

      const window =
        new THREE.Mesh(

          new THREE.BoxGeometry(
            3.0,
            .55,
            .08
          ),

          new THREE.MeshStandardMaterial({

            color:0x172554,

            metalness:.2,

            roughness:.25

          })

        );


      window.position.set(
        0,
        1.75,
        z
      );


      wagon.add(window);

    }


    wagon.position.set(
      0,
      0,
      2 + i * 6
    );


    train.add(wagon);

  }


  /* =================================================
     RODA KERETA
  ================================================= */

  for(
    let z = -8;
    z <= 16;
    z += 4
  ){

    [-1.35,1.35].forEach(
      x => {

        const wheel =
          new THREE.Mesh(

            new THREE.CylinderGeometry(
              .42,
              .42,
              .25,
              12
            ),

            new THREE.MeshStandardMaterial({

              color:0x111111,

              metalness:.5

            })

          );


        wheel.rotation.z =
          Math.PI / 2;


        wheel.position.set(
          x,
          .55,
          z
        );


        train.add(wheel);

      }
    );

  }


  train.position.set(
    -35,
    0,
    -70
  );


  train.userData.active =
    false;


  scene.add(train);

}


/* =====================================================
   TRAIN EVENT
===================================================== */

function startTrain(){

  if(!train)
    createTrain();


  train.userData.active =
    true;


  train.position.x =
    -35;


  train.position.z =
    -70;

}


/* =====================================================
   UPDATE TRAIN
===================================================== */

function updateTrain(dt){

  if(
    !train ||
    !train.userData.active
  )
    return;


  train.position.x +=
    30 * dt;


  if(
    train.position.x > 35
  ){

    train.userData.active =
      false;

  }


  if(!playerCar)
    return;


  const dz =
    Math.abs(
      train.position.z -
      playerCar.position.z
    );


  const dx =
    Math.abs(
      train.position.x -
      playerCar.position.x
    );


  if(
    dz < 5 &&
    dx < 4
  ){

    crash(train);

  }

}


/* =====================================================
   SCENERY
===================================================== */

function createScenery(){

  scenery.forEach(
    x => scene.remove(x)
  );

  scenery = [];


  const map =
    maps[save.selectedMap];


  for(
    let i = 0;
    i < 55;
    i++
  ){

    let object;


    /* CITY */

    if(map.id === 0){

      object =
        createCityBuilding();

    }


    /* DESERT */

    else if(map.id === 1){

      object =
        createCactus();

    }


    /* NIGHT */

    else{

      object =
        createNightBuilding();

    }


    object.position.z =
      -20 -
      Math.random() * 400;


    object.position.x =
      Math.random() > .5
      ?
      12 + Math.random() * 18
      :
      -12 - Math.random() * 18;


    scene.add(object);

    scenery.push(object);

  }

}
